version: '3.8'
services:
  payment-postgres:
    image: postgres:15-alpine
    container_name: payment-postgres
    environment:
      POSTGRES_DB: medisync_payment
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
    ports:
      - "5435:5432"
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
    networks:
      - medisync-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d medisync_payment"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-service:
    build: .
    container_name: payment-service
    ports:
      - "8085:8085"
    env_file:
      - .env
    environment:
      - DB_HOST=payment-postgres
    depends_on:
      payment-postgres:
        condition: service_healthy
    networks:
      - medisync-network
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  payment_postgres_data:

networks:
  medisync-network:
    external: true
