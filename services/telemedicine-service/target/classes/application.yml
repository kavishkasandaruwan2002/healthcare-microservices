server:
  port: 8080

spring:
  application:
    name: telemedicine-service
  datasource:
    url: jdbc:mysql://mysql:3306/telemedicine_service
    username: root
    password: password
  data:
    mongodb:
      uri: mongodb://mongo:27017/telemedicine_service

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
