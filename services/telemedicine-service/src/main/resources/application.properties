server.port=${SERVER_PORT:8084}
spring.application.name=telemedicine-service

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medisync_tele}
spring.datasource.username=${DB_USERNAME:tele_user}
spring.datasource.password=${DB_PASSWORD:tele_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Eureka
spring.application.name=telemedicine-service
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka-server:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.health-check-url-path=/actuator/health

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Agora
agora.app.id=${AGORA_APP_ID}
agora.app.certificate=${AGORA_APP_CERTIFICATE}

# JWT & Service Auth
jwt.secret=${JWT_SECRET}
service.secret=${SERVICE_SECRET}

# Actuator + Micrometer
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.info.env.enabled=true
info.app.name=Telemedicine Service
info.app.version=1.0.0
info.app.description=MediSync Telemedicine Video Session Microservice

# SpringDoc / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Logging
logging.level.com.medisync.telemedicine=DEBUG
logging.level.org.springframework.amqp=INFO
logging.level.org.springframework.security=INFO