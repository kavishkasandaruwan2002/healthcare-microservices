server:
  port: 8086

spring:
  application:
    name: telemedicine-service

  # PostgreSQL Database
  datasource:
    url: jdbc:postgresql://localhost:5432/telemedicine_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}

springdoc:
  api-docs:
    path: /api/telemedicine/v3/api-docs
  swagger-ui:
    path: /api/telemedicine/swagger-ui.html

# Agora
agora:
  app:
    id: ${AGORA_APP_ID:your_agora_app_id}
    certificate: ${AGORA_APP_CERTIFICATE:your_agora_app_certificate}

service:
  secret: ${SERVICE_SECRET:your-service-to-service-secret}

jwt:
  secret: ${JWT_SECRET:your_jwt_secret_key_here}


