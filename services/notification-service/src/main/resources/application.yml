server:
  port: 8086

spring:
  application:
    name: notification-service

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}

springdoc:
  api-docs:
    path: /api/notifications/v3/api-docs
  swagger-ui:
    path: /api/notifications/swagger-ui.html
