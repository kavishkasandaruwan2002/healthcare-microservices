server:
  port: 8085

spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:3001"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            exposedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: patient-service
          uri: lb://patient-service
          predicates:
            - Path=/api/patients/**
        - id: doctor-service
          uri: lb://doctor-service
          predicates:
            - Path=/api/doctors/**
        - id: appointment-service
          uri: lb://appointment-service
          predicates:
            - Path=/api/appointments/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**, /api/payments/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
        - id: telemedicine-service
          uri: lb://telemedicine-service
          predicates:
            - Path=/api/telemedicine/**
          filters:
            # Only rewrite if it's NOT the swagger docs
            - RewritePath=/api/telemedicine/(?!v3/api-docs)(?<segment>.*), /api/v1/$\{segment}
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://eureka:8761/eureka/}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  urls:
    - name: Auth Service
      url: /api/auth/v3/api-docs
    - name: Patient Service
      url: /api/patients/v3/api-docs
    - name: Doctor Service
      url: /api/doctors/v3/api-docs
    - name: Appointment Service
      url: /api/appointments/v3/api-docs
    - name: Payment Service
      url: /api/v1/payments/v3/api-docs
    - name: Notification Service
      url: /api/notifications/v3/api-docs
    - name: Telemedicine Service
      url: /api/telemedicine/v3/api-docs
    - name: AI Service
      url: /api/ai/v3/api-docs

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG
    com.netflix.discovery: INFO
