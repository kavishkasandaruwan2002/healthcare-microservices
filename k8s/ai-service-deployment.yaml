apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
      - name: ai-service
        image: healthcare/
        ports:
        - containerPort: 5000
