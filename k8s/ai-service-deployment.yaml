apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: healthcare/ai-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATA_MONGODB_URI
              value: mongodb://mongo:27017/ai_db
            - name: EUREKA_SERVER
              value: http://eureka:8761/eureka/
            - name: APP_AI_PROVIDER
              value: rules
          readinessProbe:
            httpGet:
              path: /api/ai/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/ai/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
