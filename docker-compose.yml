version: '3.9'

services:
  eureka:
    build: services/eureka-server
    container_name: eureka-server
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
    networks:
      - healthcare-network
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-healthcare_db}
      MYSQL_USER: ${MYSQL_USER:-healthcare_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-healthcare_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./databases/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - healthcare-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:latest
    container_name: mongo-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./databases/mongo/init.js:/docker-entrypoint-initdb.d/init.js
    networks:
      - healthcare-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:14
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemedicine_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - healthcare-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - healthcare-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    build: gateway
    container_name: api-gateway
    ports:
      - "${GATEWAY_PORT:-8085}:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - EUREKA_SERVER=${EUREKA_SERVER:-http://eureka:8761/eureka/}
    depends_on:
      - eureka
    networks:
      - healthcare-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8085/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build: services/auth-service
    container_name: auth-service
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-healthcare_db}
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - EUREKA_SERVER=${EUREKA_SERVER:-http://eureka:8761/eureka/}
    depends_on:
      eureka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - healthcare-network
    restart: unless-stopped

  patient-service:
    build: services/patient-service
    container_name: patient-service
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - SPRING_DATA_MONGODB_URI=mongodb+srv://Ayodya:Ayodya@cluster0.csn4fag.mongodb.net/HealthCareDB?retryWrites=true&w=majority&appName=Cluster0
      - EUREKA_SERVER=${EUREKA_SERVER:-http://eureka:8761/eureka/}
    depends_on:
      eureka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - healthcare-network
    restart: unless-stopped

  doctor-service:
    build: services/doctor-service
    container_name: doctor-service
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - SPRING_DATA_MONGODB_URI=mongodb+srv://Ayodya:Ayodya@cluster0.csn4fag.mongodb.net/HealthCareDB?retryWrites=true&w=majority&appName=Cluster0
      - EUREKA_SERVER=${EUREKA_SERVER:-http://eureka:8761/eureka/}
    depends_on:
      eureka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - healthcare-network
    restart: unless-stopped

  appointment-service:
    build: services/appointment-service
    container_name: appointment-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - SPRING_DATA_MONGODB_URI=mongodb+srv://Ayodya:Ayodya@cluster0.csn4fag.mongodb.net/HealthCareDB?retryWrites=true&w=majority&appName=Cluster0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_SERVER=${EUREKA_SERVER:-http://eureka:8761/eureka/}

    depends_on:
      eureka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - healthcare-network
    restart: unless-stopped

  payment-service:
    build: services/payment-service
    container_name: payment-service
    environment:
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - EUREKA_SERVER=${EUREKA_SERVER:-http://eureka:8761/eureka/}
    depends_on:
      eureka:
        condition: service_healthy
    networks:
      - healthcare-network
    restart: unless-stopped

  notification-service:
    build: services/notification-service
    container_name: notification-service
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - EUREKA_SERVER=${EUREKA_SERVER:-http://eureka:8761/eureka/}
      - SPRING_DATA_MONGODB_URI=mongodb+srv://Ayodya:Ayodya@cluster0.csn4fag.mongodb.net/HealthCareDB?retryWrites=true&w=majority&appName=Cluster0
      - SPRING_MAIL_HOST=smtp.gmail.com
      - SPRING_MAIL_PORT=587
      - SPRING_MAIL_USERNAME=${MAIL_USERNAME:-peirisayodya369@gmail.com}
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD:-tpmlonjrdqksnhkm}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
      - NOTIFICATION_MAIL_FROM=${MAIL_USERNAME:-peirisayodya369@gmail.com}
      - NOTIFICATION_MAIL_FROM_NAME=${MAIL_FROM_NAME:-HealthCare Platform}
    depends_on:
      eureka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - healthcare-network
    restart: unless-stopped

  telemedicine-service:
    build: services/telemedicine-service
    container_name: telemedicine-service
    ports:
      - "8084:8080"
    environment:
      - AGORA_APP_ID=${AGORA_APP_ID}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - EUREKA_SERVER=${EUREKA_SERVER:-http://eureka:8761/eureka/}
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    depends_on:
      eureka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - healthcare-network
    restart: unless-stopped

  ai-service:
    build: services/ai-service
    container_name: ai-service
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - EUREKA_SERVER=${EUREKA_SERVER:-http://eureka:8761/eureka/}
      - SPRING_DATA_MONGODB_URI=${AI_MONGODB_URI:-mongodb://mongo:27017/ai_db}
      - APP_AI_PROVIDER=${APP_AI_PROVIDER:-rules}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      eureka:
        condition: service_healthy
      mongo:
        condition: service_started
    networks:
      - healthcare-network
    restart: unless-stopped

  client:
    build: client
    container_name: frontend-client
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8085
      - NEXT_PUBLIC_TELE_API_URL=http://localhost:8085/api/telemedicine
    depends_on:
      - gateway
    networks:
      - healthcare-network
    restart: unless-stopped

networks:
  healthcare-network:
    name: healthcare-network
    driver: bridge

volumes:
  mysql-data:
  mongo-data:
  postgres-data:
